apiVersion: batch/v1
kind: CronJob
metadata:
  name: bulk-pdf-cleanup-cronjob
  namespace: egov
  labels:
    app.kubernetes.io/name: bulk-pdf-cleanup
    app.kubernetes.io/part-of: mSeva-UPYOG
    app.kubernetes.io/component: batch-cleanup
spec:
  # Runs every night at 02:00 AM IST (20:30 UTC)
  schedule: "30 20 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800 # 30 minutes timeout
      template:
        metadata:
          labels:
            app.kubernetes.io/name: bulk-pdf-cleanup
        spec:
          restartPolicy: OnFailure
          containers:
          - name: bulk-pdf-cleanup-trigger
            image: curlimages/curl:8.5.0
            imagePullPolicy: IfNotPresent
            command:
            - /bin/sh
            - -c
            - |
              echo "Starting bulk PDF cleanup run at $(date)..."
              HTTP_STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
                -X POST "http://pdf-service:8080/pdf-service/v1/_cleanupExpiredBulkPdfs" \
                -H "Content-Type: application/json" \
                -d '{
                  "RequestInfo": {
                    "apiId": "Rainmaker",
                    "ver": ".01",
                    "action": "_cleanupExpiredBulkPdfs",
                    "did": "1",
                    "key": "",
                    "msgId": "'$(date +%s%N)'|en_IN",
                    "userInfo": {
                      "id": 1129330,
                      "uuid": "42cc442b-6734-4c26-8f1f-cccc995661ee",
                      "roles": [
                        {
                          "code": "SYSTEM",
                          "name": "SYSTEM"
                        }
                      ]
                    }
                  }
                }')
              
              echo "HTTP Status: $HTTP_STATUS"
              echo "Response Payload:"
              cat /tmp/response.json
              echo ""
              
              if [ "$HTTP_STATUS" -eq 200 ]; then
                echo "Bulk PDF cleanup completed successfully."
                exit 0
              else
                echo "Bulk PDF cleanup failed with status $HTTP_STATUS."
                exit 1
              fi
            resources:
              requests:
                memory: "64Mi"
                cpu: "50m"
              limits:
                memory: "128Mi"
                cpu: "100m"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              runAsNonRoot: true
              runAsUser: 1000
