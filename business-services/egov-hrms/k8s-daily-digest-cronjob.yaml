apiVersion: batch/v1
kind: CronJob
metadata:
  name: egov-hrms-daily-digest
  namespace: egov
  labels:
    app.kubernetes.io/name: egov-hrms-daily-digest
    app.kubernetes.io/part-of: uptyog
spec:
  # Runs every morning at 07:00 AM IST (01:30 UTC)
  schedule: "30 1 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: egov-hrms-daily-digest
        spec:
          restartPolicy: OnFailure
          containers:
            - name: trigger-digest
              image: curlimages/curl:8.5.0
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  memory: "32Mi"
                  cpu: "50m"
                limits:
                  memory: "64Mi"
                  cpu: "100m"
              command:
                - /bin/sh
                - -c
                - |
                  echo "Triggering egov-hrms daily pending applications digest..."
                  STATUS=$(curl -s -o /tmp/response.json -w "%{http_code}" \
                    -X POST "http://egov-hrms.egov.svc.cluster.local:8080/egov-hrms/employees/notifications/_send-daily-digest" \
                    -H "Content-Type: application/json" \
                    -d '{"RequestInfo":{"apiId":"org.egov.hrms","ver":"1.0","action":"_send-daily-digest"}}')
                  
                  echo "HTTP Status Code: $STATUS"
                  cat /tmp/response.json
                  echo ""

                  if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
                    echo "Daily digest executed successfully!"
                    exit 0
                  else
                    echo "Daily digest execution failed with status: $STATUS"
                    exit 1
                  fi
