# Kafka Connection (Ensure these are correct for your environment)
# Updated Kafka Connection properties
spring.kafka.bootstrap-servers=localhost:9092
# KAFKA CONSUMER CONFIGURATIONS
spring.kafka.consumer.enable-auto-commit=true
spring.kafka.consumer.auto-commit-interval=100
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=com.mseva.gisintegration.consumer.HashMapDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=egov-gis-integration
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.properties.spring.json.use.type.headers=false


# Kafka consumer tuning to prevent partition rebalancing
# max.poll.interval.ms  : Max time between two consecutive poll() calls (10 min)
# session.timeout.ms    : Broker declares consumer dead if no heartbeat in this window (60 s)
# heartbeat.interval.ms : How often the client sends heartbeats (must be < session.timeout / 3)
# max.poll.records      : Reduce records per poll so each poll completes faster
kafka.consumer.max.poll.interval.ms=600000
kafka.consumer.session.timeout.ms=60000
kafka.consumer.heartbeat.interval.ms=20000
kafka.consumer.max.poll.records=5
spring.kafka.consumer.properties.max.poll.interval.ms=${kafka.consumer.max.poll.interval.ms}
spring.kafka.consumer.properties.session.timeout.ms=${kafka.consumer.session.timeout.ms}
spring.kafka.consumer.properties.heartbeat.interval.ms=${kafka.consumer.heartbeat.interval.ms}
spring.kafka.consumer.properties.max.poll.records=${kafka.consumer.max.poll.records}

# KAFKA PRODUCER CONFIGURATIONS
spring.kafka.producer.retries=0
spring.kafka.producer.batch-size=16384
spring.kafka.producer.buffer-memory=33554432
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


