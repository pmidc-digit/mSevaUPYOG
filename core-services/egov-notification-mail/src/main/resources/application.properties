#Kafka Topic config
#kafka.topics.notification.mail.name=egov.core.notification.email
kafka.topics.notification.mail.name=org.egov.core.notification.email
kafka.topics.notification.sms.topic.name=egov.core.notification.sms
spring.mail.properties.mail.debug=true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.egov.tracer.kafka.deserializer.HashMapDeserializer
spring.kafka.consumer.group-id=egov_email_group

spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.properties.spring.json.use.type.headers=false

# ─────────────────────────────────────────────────────────────────────────────
# Email Provider Toggle
#   nic.mail.enabled=true  → use NIC SMTP relay
#   nic.mail.enabled=false → use Gmail SMTP
# ─────────────────────────────────────────────────────────────────────────────
mail.enabled=true
nic.mail.enabled=true

# NIC SMTP Relay Configuration
��
# NIC host is selected automatically at send time:
#   email subject/body contains "OTP" → mail.nic.host.otp
#   otherwise                          → mail.nic.host.smtpsgw
#
# NOTE: relayotps.nic.in requires NIC-side network whitelisting.
#       If unreachable, set mail.nic.host.otp=relaysmtpsgw.nic.in as a fallback.
mail.nic.host.otp=relayotps.nic.in
mail.nic.host.smtpsgw=relaysmtpsgw.nic.in
mail.nic.port=465
mail.nic.protocol=smtp
mail.nic.sender.username=itsupport.lg@punjab.gov.in
mail.nic.sender.password=UNKNOWN
mail.nic.smtp.from=itsupport.lg@punjab.gov.in
mail.nic.smtp.auth=true
mail.nic.smtp.starttls.enable=true
mail.nic.smtp.starttls.required=true
mail.nic.smtp.ssl.protocols=TLSv1.2
mail.nic.smtp.ssl.trust=*
mail.nic.smtp.timeout=30000
mail.nic.smtp.connectiontimeout=30000
mail.nic.smtp.writetimeout=30000
mail.nic.smtp.debug=true

��
# Gmail SMTP Configuration (used when nic.mail.enabled=false)
��
mail.gmail.host=smtp.gmail.com
mail.gmail.port=587
mail.gmail.protocol=smtp
mail.gmail.sender.username=noreply.itpmidc@gmail.com
mail.gmail.sender.password=UNKNOWN
mail.gmail.smtp.from=noreply.itpmidc@gmail.com
mail.gmail.smtp.auth=true
mail.gmail.smtp.starttls.enable=true
mail.gmail.smtp.starttls.required=true
mail.gmail.smtp.ssl.protocols=TLSv1.2
mail.gmail.smtp.ssl.trust=smtp.gmail.com
mail.gmail.smtp.timeout=30000
mail.gmail.smtp.connectiontimeout=30000
mail.gmail.smtp.writetimeout=30000
mail.gmail.smtp.debug=false

