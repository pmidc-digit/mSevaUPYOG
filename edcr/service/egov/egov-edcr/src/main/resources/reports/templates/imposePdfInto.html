<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <style>
    @page { margin: 8pt; }
    body { font-family: Arial, sans-serif; font-size: 12px; color: #111; margin: 0; }
    .section { margin: 0 0 8pt 0; page-break-inside: avoid; }
    .title { background: #2f5d94; color: #fff; padding: 6pt 8pt; font-weight: 700; border: 1px solid #38485a; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { border: 1px solid #555; padding: 6pt 7pt; vertical-align: top; word-wrap: break-word; }
    th { background: #e4edf8; font-weight: 700; }
    tr:nth-child(even) td { background: #f7fbff; }
    .title { font-size: 12px; }
    table { line-height: 1.25; }
    .remarks-table td { background: #fff !important; }
    .signature-image { max-width: 100px; max-height: 40px; width: auto; height: auto; display: block; }
    .ws-note { margin: 0 0 8pt 0; padding: 6pt 8pt; border: 1px solid #ff0000; color: #ff0000;
               font-weight: 700; font-size: 11px; line-height: 1.3; page-break-inside: avoid; }
  </style>
</head>
<body>
  <div th:each="section : ${sections}" class="section">
    <div class="title" th:if="${section['hideTitle'] == null or !section['hideTitle']}" th:text="${section.title}">Section</div>
    <table th:classappend="${section['hideTitle']} ? 'remarks-table' : ''">
      <thead th:if="${section.showHeader}">
        <tr>
          <th th:each="col : ${section.columns}" th:text="${col}">Col</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="row : ${section.rows}">
          <td th:each="cell, cellStat : ${row}">
             <span th:if="${!(section['renderSignatureImage'] == true and cellStat.index == 1)}"
          th:text="${cell}">
        Value
    </span>
    <img th:if="${section['renderSignatureImage'] == true
                 and cellStat.index == 1
                 and cell != null
                 and !#strings.isEmpty(cell)
                 and !#strings.equalsIgnoreCase(cell, 'N/A')
                 and !#strings.equalsIgnoreCase(cell, 'null')
                 and !#strings.equalsIgnoreCase(cell, '-')}"
         th:src="${cell}"
         alt="Signature"
         class="signature-image" />
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <!-- WORK_SHEET scrutiny note: last block of the table (only when the flag is enabled) -->
  <div class="ws-note" th:if="${workSheetNote != null}" th:text="${workSheetNote}">NOTE</div>
</body>
</html>
