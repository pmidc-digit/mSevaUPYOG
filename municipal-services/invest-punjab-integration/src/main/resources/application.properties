# ===================================================================
# Invest Punjab (FastTrack Punjab) Integration Service
# Municipal Services - mSeva UPYOG
# ===================================================================

# Server Configuration
server.port=8099
server.context-path=/invest-punjab-integration
server.servlet.context-path=/invest-punjab-integration

# Spring Application
spring.application.name=invest-punjab-integration

# Spring Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:invest-punjab-integration-consumer-group}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.concurrency.count=${KAFKA_CONSUMER_CONCURRENCY:3}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.listener.missing-topics-fatal=false

# Kafka Topics for Invest Punjab Integration
kafka.topics.invest.punjab.status.update=${KAFKA_TOPIC_INVEST_PUNJAB_STATUS_UPDATE:update-invest-punjab-status}
kafka.topics.invest.punjab.status.success=${KAFKA_TOPIC_INVEST_PUNJAB_STATUS_SUCCESS:invest-punjab-status-success}
kafka.topics.invest.punjab.status.error=${KAFKA_TOPIC_INVEST_PUNJAB_STATUS_ERROR:invest-punjab-status-error}

# Backward Compatibility Topic Aliases
kafka.topics.pdc.status.update=${kafka.topics.invest.punjab.status.update}
kafka.topics.pdc.status.success=${kafka.topics.invest.punjab.status.success}
kafka.topics.pdc.status.error=${kafka.topics.invest.punjab.status.error}

# Municipal Service Ingestion Topics (Trade License, Water, Sewerage)
kafka.topics.tl.save=${KAFKA_TOPIC_TL_SAVE:save-tl-tradelicense}
kafka.topics.tl.update=${KAFKA_TOPIC_TL_UPDATE:update-tl-tradelicense}
kafka.topics.tl.workflow=${KAFKA_TOPIC_TL_WORKFLOW:update-tl-workflow}

kafka.topics.ws.save=${KAFKA_TOPIC_WS_SAVE:save-ws-connection}
kafka.topics.ws.update=${KAFKA_TOPIC_WS_UPDATE:update-ws-connection}
kafka.topics.ws.workflow=${KAFKA_TOPIC_WS_WORKFLOW:update-ws-workflow}

kafka.topics.sw.save=${KAFKA_TOPIC_SW_SAVE:save-sw-connection}
kafka.topics.sw.update=${KAFKA_TOPIC_SW_UPDATE:update-sw-connection}
kafka.topics.sw.workflow=${KAFKA_TOPIC_SW_WORKFLOW:update-sw-workflow}

# Redis Configuration
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.timeout=60000

# ===================================================================
# Invest Punjab FastTrack Portal (STAGING / UAT ENVIRONMENT - ACTIVE)
# ===================================================================
invest.punjab.base.url=${INVEST_PUNJAB_BASE_URL:https://fasttrack.punjab.gov.in}

# Staging Endpoints (Active for UAT & Staging Testing)
invest.punjab.token.path=${INVEST_PUNJAB_TOKEN_PATH:/integration-staging/api/iptoken/gettoken/v1}
invest.punjab.status.path=${INVEST_PUNJAB_STATUS_PATH:/integration-staging/api/localgovt/updateStatus}
invest.punjab.caf.path=${INVEST_PUNJAB_CAF_PATH:/integration-staging/api/localgovt/getCAFData}
invest.punjab.integration.key=${INVEST_PUNJAB_INTEGRATION_KEY:UAT_LG}
invest.punjab.return.url=${INVEST_PUNJAB_RETURN_URL:https://fasttrack.punjab.gov.in/testportal/dashboard/investor-dashboard?t=RC&role=INVT}

# [Reference] Production Endpoints for Future Cutover:
# invest.punjab.token.path=/integration-prod/api/iptoken/gettoken/v1
# invest.punjab.status.path=/webportalnode/api/localgovt/updateStatus
# invest.punjab.caf.path=/integration-prod/api/localgovt/getCAFData
# invest.punjab.return.url=https://fasttrack.punjab.gov.in/webportal/dashboard/investor-dashboard?t=RC&role=INVT

# Token Caching (Redis 30-Second Safety Buffer Rule)
invest.punjab.token.cache.key=${INVEST_PUNJAB_TOKEN_CACHE_KEY:INVEST_PUNJAB_AUTH_TOKEN}
invest.punjab.token.min.buffer.seconds=${INVEST_PUNJAB_TOKEN_MIN_BUFFER_SECONDS:30}
invest.punjab.token.default.ttl=${INVEST_PUNJAB_TOKEN_DEFAULT_TTL:3600}

# Security Keys from Technical Specification v1.2
invest.punjab.aes.secret.key=${INVEST_PUNJAB_AES_KEY:N78I99C8t--L0008}
invest.punjab.checksum.secret.key=${INVEST_PUNJAB_CHECKSUM_KEY:BF9EFK9tEbJF}
invest.punjab.default.source=${INVEST_PUNJAB_DEFAULT_SOURCE:LG}

# Backward Compatibility Aliases for pdc.*
pdc.base.url=${invest.punjab.base.url}
pdc.token.path=${invest.punjab.token.path}
pdc.status.path=${invest.punjab.status.path}
pdc.caf.path=${invest.punjab.caf.path}
pdc.integration.key=${invest.punjab.integration.key}
pdc.return.url=${invest.punjab.return.url}
pdc.token.cache.key=${invest.punjab.token.cache.key}
pdc.token.min.buffer.seconds=${invest.punjab.token.min.buffer.seconds}
pdc.token.default.ttl=${invest.punjab.token.default.ttl}
pdc.aes.secret.key=${invest.punjab.aes.secret.key}
pdc.checksum.secret.key=${invest.punjab.checksum.secret.key}
pdc.default.source=${invest.punjab.default.source}

# Logging Configuration
logging.level.org.egov.investpunjab=DEBUG

